name: Build and Release ZeroAxisPad

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroAxisPad-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-exe:
    name: Build Windows Host Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone Windows Executable
        run: |
          cd server
          pyinstaller --onefile --name "ZeroAxisPad-Host" standalone_server.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroAxisPad-Windows-Host-EXE
          path: server/dist/ZeroAxisPad-Host.exe

  create-pre-release:
    name: Create GitHub Pre-Release
    needs: [build-apk, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZeroAxisPad-Android-APK
          path: release-assets

      - name: Download Windows EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZeroAxisPad-Windows-Host-EXE
          path: release-assets

      - name: Rename Release Files
        run: |
          mv release-assets/app-debug.apk release-assets/ZeroAxisPad-v1.0.0-pre.apk || true
          mv release-assets/ZeroAxisPad-Host.exe release-assets/ZeroAxisPad-Host-v1.0.0-pre.exe || true
          ls -la release-assets

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-pre' }}
          name: ZeroAxisPad v1.0.0-pre
          prerelease: true
          draft: false
          body: |
            ## 🎮 ZeroAxisPad v1.0.0-pre Release

            High-performance, 100% open-source, paywall-free Virtual Controller & Gyro Steering System for PCs.

            ### 📦 Release Assets
            - **📱 Android APK (`ZeroAxisPad-v1.0.0-pre.apk`):** Native Android app with ultra-low latency WebSockets, full haptic feedback, and gyroscope steering.
            - **💻 PC Host Server (`ZeroAxisPad-Host-v1.0.0-pre.exe`):** Standalone zero-dependency Windows daemon executing DirectInput scancodes with microsecond response times.

            ### ✨ Key Features
            - 🕹️ **Gamepad Mode:** Dual analog sticks, 8-way D-pad, ABXY face buttons, and triggers.
            - 🏎️ **Gyro Motion Controller:** Phone tilt mapping to analog steering wheel axis with center calibration.
            - 🖱️ **Air Mouse & Trackpad:** Multi-touch surface, gestures, and pointer clutch button.
            - 🎛️ **Macro & Media Deck:** Media playback, volume controls, OBS, Discord, and custom macros.
            - ⚡ **Ultra-Low Latency Wi-Fi:** QR code instant pairing (<15ms RTT).
          files: |
            release-assets/ZeroAxisPad-v1.0.0-pre.apk
            release-assets/ZeroAxisPad-Host-v1.0.0-pre.exe
